name: Production quotidienne

# Objectif : vidéo prête et livrée à 09:00 (Europe/Berlin).
# GitHub ne connaît que l'UTC (et peut retarder un cron) : deux déclenchements, le second ne sert
# qu'à reprendre un épisode inachevé. Le job « livrer » attend 09:00 heure allemande si tout est prêt plus tôt.
on:
  schedule:
    - cron: "23 5 * * *"   # 06:23 (hiver) / 07:23 (été) à Berlin
    - cron: "53 6 * * *"   # reprise éventuelle
  workflow_dispatch:
    inputs:
      force: { description: "Produire même si l'épisode du jour existe", type: boolean, default: false }
      preview: { description: "Rendu rapide basse définition (test)", type: boolean, default: false }
      no_llm: { description: "Sans modèle de langage (gabarits)", type: boolean, default: false }
      no_wait: { description: "Ne pas attendre 09:00", type: boolean, default: false }

permissions:
  contents: write
  issues: read
  actions: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIPER_VOICES: ${{ github.workspace }}/.cache/piper
  LLM_CACHE: ${{ github.workspace }}/.cache/llm

jobs:
  # 1-4 : vérifier l'état, écrire le scénario, préparer voix et plan de tournage
  preparer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      produce: ${{ steps.prep.outputs.produce }}
      episode: ${{ steps.prep.outputs.episode }}
      matrix: ${{ steps.chunks.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - name: Outils système
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
      - name: Dépendances Python
        run: |
          pip install -q -r requirements.txt
          pip install -q llama-cpp-python --prefer-binary \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            || echo "::warning::llama-cpp-python indisponible : repli sur les gabarits"
      - name: Rhubarb Lip Sync (MIT)
        run: |
          curl -sSL -o /tmp/rh.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip \
            && unzip -q /tmp/rh.zip -d /opt && sudo ln -sf /opt/Rhubarb-Lip-Sync-1.13.0-Linux/rhubarb /usr/local/bin/rhubarb \
            || echo "::warning::Rhubarb indisponible : lip-sync acoustique"
      - name: Cache modèles (voix Piper + LLM)
        uses: actions/cache@v4
        with:
          path: .cache
          key: models-v1-${{ hashFiles('config/studio.json', 'memory/characters.json') }}
          restore-keys: models-v1-
      - name: Reprise d'un épisode en cours
        uses: actions/cache/restore@v4
        with:
          path: work/current
          key: work-${{ github.run_id }}
          restore-keys: work-
      - name: Tests rapides (mémoire figée, validation)
        run: python -m pytest -q tests -m "not blender" -x
      - name: Scénario, voix, plan de tournage
        id: prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m studio.pipeline prepare \
            ${{ inputs.force && '--force' || '' }} ${{ inputs.no_llm && '--no-llm' || '' }}
      - name: Découpage du rendu
        id: chunks
        if: steps.prep.outputs.produce == 'true'
        run: python -m studio.pipeline chunks
      - name: Sauver l'épisode en cours (reprise)
        if: steps.prep.outputs.produce == 'true'
        uses: actions/cache/save@v4
        with:
          path: work/current
          key: work-${{ github.run_id }}-prep
      - uses: actions/upload-artifact@v4
        if: steps.prep.outputs.produce == 'true'
        with: { name: work, path: work/current, retention-days: 3, include-hidden-files: false }
      - name: Enregistrer le scénario dans le dépôt
        if: steps.prep.outputs.produce == 'true'
        run: |
          git config user.name "studio-bot"; git config user.email "studio-bot@users.noreply.github.com"
          git add episodes/ && git commit -qm "Épisode ${{ steps.prep.outputs.episode }} : scénario" || true
          git pull -q --rebase && git push -q || echo "::warning::push du scénario impossible"

  # 5 : animation (rendu Blender réparti sur plusieurs machines gratuites)
  rendu:
    needs: preparer
    if: needs.preparer.outputs.produce == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.preparer.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: work, path: work/current }
      - name: Images déjà rendues (reprise)
        uses: actions/cache/restore@v4
        with:
          path: work/current/shots
          key: shots-${{ needs.preparer.outputs.episode }}-${{ matrix.chunk }}-${{ github.run_id }}
          restore-keys: shots-${{ needs.preparer.outputs.episode }}-${{ matrix.chunk }}-
      - name: "Blender (cache des paquets, évite les miroirs apt lents)"
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        continue-on-error: true
        with: { packages: blender ffmpeg xvfb fonts-dejavu-core, version: "1" }
      - name: Vérifier Blender
        run: |
          command -v blender && blender --version | head -1 && command -v xvfb-run \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq blender ffmpeg xvfb fonts-dejavu-core)
      - name: Rendu
        id: r1
        continue-on-error: true
        run: python3 -m studio.pipeline render --chunk ${{ matrix.chunk }} ${{ inputs.preview && '--preview' || '' }}
      - name: Repli sur le moteur stable
        if: steps.r1.outcome == 'failure'
        run: |
          if git rev-parse -q --verify refs/tags/stable >/dev/null; then
            echo "::warning::Moteur actuel en échec : nouvel essai avec le moteur « stable »"
            git checkout stable -- studio/animation animations
            python3 -m studio.pipeline render --chunk ${{ matrix.chunk }} ${{ inputs.preview && '--preview' || '' }}
          else
            exit 1
          fi
      - name: Sauver les images (reprise)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/current/shots
          key: shots-${{ needs.preparer.outputs.episode }}-${{ matrix.chunk }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: plans-${{ matrix.chunk }}
          path: |
            work/current/shots/*.mp4
            work/current/shots/stats_*.json
          retention-days: 3

  # 6-11 : son, montage, sous-titres, contrôle qualité, export
  montage:
    needs: [preparer, rendu]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: work, path: work/current }
      - uses: actions/download-artifact@v4
        with: { pattern: plans-*, path: work/current/shots, merge-multiple: true }
      - name: Montage + contrôle qualité
        run: python -m studio.pipeline assemble
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rapport-qualite, path: "work/current/final/qa.*", retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: |
            work/current/final/*.mp4
            work/current/final/*.png
            work/current/final/*.srt
            work/current/final/legende.txt
            work/current/final/qa.md
            work/current/final/qa.json
            work/current/episode.json
          retention-days: 3

  # 11-12 : livraison à 09:00 + mémoire pour les épisodes suivants
  livrer:
    needs: [preparer, montage]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: final, path: work/current }
      - name: Attendre 09:00 (Berlin)
        if: ${{ !inputs.no_wait && github.event_name == 'schedule' }}
        run: python -m studio.wait_until 9
      - name: Préparer le paquet
        run: |
          ls -R work/current | head -30
          N=$(printf "%03d" ${{ needs.preparer.outputs.episode }})
          mkdir -p livraison && cp work/current/final/vallee_ep${N}.mp4 work/current/final/vallee_ep${N}.png \
            work/current/final/vallee_ep${N}.srt work/current/final/legende.txt work/current/final/qa.md livraison/
          echo "N=$N" >> $GITHUB_ENV
      - name: Publier la vidéo (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ env.N }}
          path: livraison/
          retention-days: 30
          compression-level: 0
      - name: Mémoire + mesures + version stable
        run: |
          python -m studio.pipeline publish
          git config user.name "studio-bot"; git config user.email "studio-bot@users.noreply.github.com"
          git add memory/state.json memory/world.json episodes/ improvements/
          git commit -qm "Épisode ${{ needs.preparer.outputs.episode }} livré" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && break || sleep 5; done
          # le moteur qui vient de produire un épisode validé devient la version « stable »
          git tag -f stable HEAD && git push -qf origin stable
      - name: Nettoyer le cache de reprise
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh cache list --key work- --json id -q '.[].id' | xargs -r -n1 gh cache delete || true
