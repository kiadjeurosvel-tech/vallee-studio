name: Tests

# Toute modification du moteur doit passer ces tests (unitaires + rendu Blender de contrôle)
# avant d'être utilisée en production. Les pull requests sont testées de la même façon.
on:
  push:
    branches: [main]
    paths-ignore: ["episodes/**", "improvements/metrics.jsonl", "improvements/reports/**", "memory/state.json", "memory/world.json"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unitaires:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
      - run: pip install -q -r requirements.txt
      - run: STUDIO_TTS=espeak python -m pytest -q -m "not blender"

  rendu-controle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq blender ffmpeg xvfb python3-pytest python3-numpy python3-pil
      - run: python3 -m pytest -q -m blender
